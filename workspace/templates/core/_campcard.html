{% load core_extras %}<article class="card"><span class="badge{% if c.complet %} off{% endif %}">{% if c.complet %}Complet ou fermé{% else %}Ouverte{% endif %}</span><h3>{{ c.titre }}</h3><p>{% icon 'pin' %} {{ c.lieu }}<br>{{ c.date_debut|date:"d/m/Y H:i" }}</p><div class="meta"><span>Places</span><span>{{ c.inscrits }} / {{ c.capacite }}</span></div><div class="bar"><i style="width:{{ c.pct }}%"></i></div><a class="more" href="{% url 'campagne' c.pk %}">Détails {% icon 'arrow' %}</a></article>
